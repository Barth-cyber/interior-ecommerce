<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="backend-url" content="https://interior-ecommerce-production.up.railway.app">
  <script src="static/backend-config.js"></script>
  <title>Second-Hand Marketplace — Interior Duct Ltd</title>
  <link rel="stylesheet" href="duct-ai-widget.css?v=20260429">
  <style>
    body{font-family:DM Sans, sans-serif;padding:1.2rem;background:#f7f7f9}
    .market-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem}
    .market-card{background:#fff;border-radius:10px;padding:1rem;border:1px solid rgba(0,0,0,0.06)}
    .market-card img{width:100%;height:180px;object-fit:cover;border-radius:6px}
    .market-card h4{margin:.6rem 0 .3rem}
    .market-actions{display:flex;gap:.5rem}
    .btn{padding:.5rem .8rem;border-radius:6px;border:none;cursor:pointer}
    .btn-primary{background:#1B3A6B;color:#fff}
    .btn-outline{background:#fff;border:1px solid #ddd}
  </style>
</head>
<body>
  <header style="display:flex;align-items:center;justify-content:space-between;gap:1rem;">
    <h1 style="font-size:1.2rem;margin:0">Second-Hand Marketplace</h1>
    <a href="/interior.html" style="color:#556;text-decoration:none">Back to showroom</a>
  </header>

  <p style="color:#556;max-width:880px">Browse verified listings of pre-owned workshop machines, tools, furniture fittings and lighting. Admins can upload pictures via the Admin panel; listings include images, descriptions and enquiry actions.</p>

  <div id="marketGrid" class="market-grid"></div>

  <script>
    async function loadListings(){
      try{
        const res = await fetch('second_hand_products.json');
        const data = await res.json();
        const grid = document.getElementById('marketGrid');
        grid.innerHTML = '';
        for(const p of data.products||[]){
          const card = document.createElement('div');
          card.className = 'market-card';
          card.innerHTML = `<img src="${p.image||'IDL_Product_branding/placeholder.jpg'}" alt="${p.name}"><h4>${p.name}</h4><p style=\"color:#555;\">${p.description||''}</p><div class=\"market-actions\"><button class=\"btn btn-primary\" onclick=\"window.open('https://wa.me/2348036850229?text='+encodeURIComponent('Enquiry about '+${JSON.stringify(p.name)}) ,'_blank')\">Enquire via WhatsApp</button><a class=\"btn btn-outline\" href=\"/admin/index.html#images\">Upload image / Admin</a></div>`;
          grid.appendChild(card);
        }
      }catch(e){
        console.error('Failed to load marketplace listings', e);
      }
    }
    loadListings();
  </script>
</body>
</html>
